<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OW Text 访谈</title>
  <style>
    :root { --bg: #f7f4f1; --card: #fffdfb; --text: #181818; --muted: #6b625c; --accent: #c8102e; --accent-light: #fff0f3; --border: #ded7d0; --shadow: rgba(24,24,24,0.08); }
    @media (prefers-color-scheme: dark) { :root { --bg: #141211; --card: #1f1b19; --text: #f7f4f1; --muted: #b8aca4; --accent: #ff4d63; --accent-light: #35171d; --border: #403832; --shadow: rgba(0,0,0,0.3); } }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .container { max-width: 720px; margin: 0 auto; padding: 24px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .brand img { width: min(220px, 60vw); height: auto; display: block; }
    .brand-mark { width: 44px; height: 4px; background: var(--accent); border-radius: 999px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px var(--shadow); }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .subtitle { color: var(--muted); margin: 0 0 24px; }
    label { display: block; font-weight: 500; margin-bottom: 6px; }
    textarea, input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    select { cursor: pointer; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: white; font: inherit; font-weight: 500; cursor: pointer; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .row > .btn { flex: 0 0 auto; }
    .chat { display: flex; flex-direction: column; gap: 12px; max-height: 60vh; overflow-y: auto; padding: 8px 0; }
    .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--accent); color: white; }
    .msg.assistant { align-self: flex-start; background: var(--accent-light); border: 1px solid var(--border); }
    .input-area { display: flex; gap: 10px; margin-top: 12px; }
    .input-area textarea { flex: 1; min-height: 60px; }
    .hidden { display: none !important; }
    .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-bottom-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .report h2 { margin-top: 0; }
    .report section { margin-bottom: 24px; }
    .report h3 { font-size: 1rem; margin-bottom: 8px; }
    .report ul { padding-left: 20px; }
    .quote { font-style: italic; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0; }
    .error { color: var(--accent); background: var(--accent-light); padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .hint { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
    .model-row { display: flex; gap: 10px; align-items: flex-start; }
    .model-row select { flex: 1; }
    .msg-meta { font-size: 0.75rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .eval-section { margin-top: 16px; }
    .score { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .score-bar-wrap { width: 100%; height: 6px; background: var(--border); border-radius: 3px; margin-top: 4px; }
    .score-bar { height: 100%; background: var(--accent); border-radius: 3px; }
    .comment { padding: 12px; background: var(--bg); border-radius: 8px; margin-top: 8px; }
    .framework-editor { width: 100%; min-height: 240px; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.85rem; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
    .topic-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: var(--bg); }
    .topic-card h4 { margin: 0 0 6px; font-size: 0.95rem; }
    .topic-card p { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .ended-notice { background: var(--accent-light); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="brand" aria-label="Oliver Wyman">
      <img src="/OliverWyman-logo-2021.jpg" alt="Oliver Wyman" />
      <span class="brand-mark" aria-hidden="true"></span>
    </header>

    <div id="setup" class="card">
      <h1>OW Text 访谈</h1>
      <p class="subtitle">AI 主持的用户访谈，先设计框架，再动态追问，自然收尾。</p>

      <label for="provider">模型提供商</label>
      <select id="provider">
        <option value="openai">OpenAI / OpenAI 兼容</option>
        <option value="anthropic">Anthropic</option>
        <option value="custom">自定义 OpenAI 兼容端点</option>
      </select>
      <p class="hint">Anthropic 将自动使用 /messages，其余兼容端点使用 /chat/completions。</p>

      <label for="baseUrl" style="margin-top:12px">API 地址（可选）</label>
      <input type="text" id="baseUrl" placeholder="留空使用默认地址" />

      <label for="apiKey" style="margin-top:12px">API Key</label>
      <input type="text" id="apiKey" placeholder="sk-... 或 anthropic 的 key" />
      <p class="hint">仅在请求中临时使用，不会保存到服务器。</p>

      <div class="model-row" style="margin-top:12px">
        <div style="flex:1">
          <label for="model">模型</label>
          <select id="model" disabled><option value="">先点击“获取模型”</option></select>
        </div>
        <button id="fetchModelsBtn" class="btn" style="margin-top:23px">获取模型</button>
      </div>
      <div id="modelsError" class="error hidden"></div>

      <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border)">
        <h3 style="margin:0 0 12px; font-size:1rem">研究设计</h3>
        <label for="goal">研究目标</label>
        <textarea id="goal" placeholder="例如：了解用户为什么在新手引导阶段流失"></textarea>

        <label for="methodology" style="margin-top:12px">方法学</label>
        <select id="methodology">
          <option value="general">通用</option>
          <option value="JTBD">Jobs-to-be-Done</option>
          <option value="5whys">五问法（5 Whys）</option>
          <option value="star">STAR</option>
          <option value="persona">Persona 画像</option>
        </select>

        <label for="targetAudience" style="margin-top:12px">目标受众</label>
        <textarea id="targetAudience" placeholder="例如：25-35 岁一线城市 SaaS 产品经理，每天使用 3+ 工具"></textarea>

        <label for="scenarios" style="margin-top:12px">研究场景</label>
        <textarea id="scenarios" placeholder="例如：首次注册、付费决策、流失前最后一次登录"></textarea>

        <label for="persona" style="margin-top:12px">受访者画像 / 上下文</label>
        <textarea id="persona" placeholder="例如：时间紧张、关注 ROI、对数据敏感"></textarea>
      </div>

      <div class="row" style="margin-top:16px">
        <button id="generateFrameworkBtn" class="btn" disabled>生成访谈框架</button>
      </div>
      <div id="setupError" class="error hidden"></div>
    </div>

    <div id="framework" class="card hidden">
      <h1>访谈框架</h1>
      <p class="subtitle">AI 根据研究设计生成的访谈话题。你可以在下方 JSON 中直接修改。</p>
      <div id="frameworkPreview"></div>
      <label for="frameworkEditor" style="margin-top:16px">框架 JSON（可编辑）</label>
      <textarea id="frameworkEditor" class="framework-editor"></textarea>
      <div class="row" style="margin-top:16px">
        <button id="backToDesignBtn" class="btn secondary">返回修改设计</button>
        <button id="startBtn" class="btn">开始访谈</button>
      </div>
      <div id="frameworkError" class="error hidden"></div>
    </div>

    <div id="chat" class="card hidden">
      <div class="row" style="justify-content:space-between; margin-bottom:12px">
        <h1 style="font-size:1.25rem">访谈</h1>
        <button id="endBtn" class="btn secondary">结束并生成报告</button>
      </div>
      <div id="endedNotice" class="ended-notice hidden">
        访谈已自然结束。你可以查看报告，或继续补充回答。
      </div>
      <div id="messages" class="chat"></div>
      <div id="typing" class="hidden" style="color:var(--muted); padding:8px 0">主持人正在输入…</div>
      <div class="input-area">
        <textarea id="answer" placeholder="输入你的回答…"></textarea>
        <button id="sendBtn" class="btn">发送</button>
      </div>
      <div id="chatError" class="error hidden"></div>
    </div>

    <div id="report" class="card hidden report">
      <div class="row" style="justify-content:space-between; margin-bottom:16px">
        <h1>洞察报告</h1>
        <div class="row" style="flex:0 0 auto">
          <button id="evalBtn" class="btn secondary">评估访谈</button>
          <button id="newBtn" class="btn secondary">新建访谈</button>
        </div>
      </div>
      <div id="evalContent"></div>
      <div id="reportContent"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let sessionId = null;
    let currentConfig = {};
    let currentDesign = {};
    let currentFramework = null;

    async function api(url, opts = {}) {
      const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    function appendMessage(role, text, meta = {}) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      let html = escapeHtml(text);
      if (role === 'assistant' && (meta.topic_name || meta.stage || meta.action || meta.reason)) {
        html += `<div class="msg-meta">`;
        const parts = [];
        if (meta.topic_name) parts.push(`话题：${escapeHtml(meta.topic_name)}`);
        if (meta.stage) parts.push(`阶段：${escapeHtml(meta.stage)}`);
        if (meta.action) parts.push(`动作：${escapeHtml(meta.action)}`);
        if (parts.length) html += parts.join(' · ');
        if (meta.reason) html += `<br>理由：${escapeHtml(meta.reason)}`;
        html += `</div>`;
      }
      div.innerHTML = html;
      $('messages').appendChild(div);
      $('messages').scrollTop = $('messages').scrollHeight;
    }

    function getConfig() {
      return {
        provider: $('provider').value,
        baseUrl: $('baseUrl').value.trim(),
        apiKey: $('apiKey').value.trim(),
        model: $('model').value,
      };
    }

    function getDesign() {
      return {
        goal: $('goal').value.trim(),
        methodology: $('methodology').value,
        targetAudience: $('targetAudience').value.trim(),
        scenarios: $('scenarios').value.trim(),
        persona: $('persona').value.trim(),
      };
    }

    $('fetchModelsBtn').onclick = async () => {
      const cfg = getConfig();
      if (!cfg.apiKey) return $('modelsError').textContent = '请先填写 API Key。';
      $('fetchModelsBtn').disabled = true;
      hide($('modelsError'));
      $('model').innerHTML = '<option value="">加载中…</option>';
      $('model').disabled = true;
      try {
        const { models } = await api('/api/models', { method: 'POST', body: JSON.stringify(cfg) });
        if (!models.length) throw new Error('未获取到可用模型');
        $('model').innerHTML = models.map(m => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.id)}</option>`).join('');
        $('model').disabled = false;
        $('generateFrameworkBtn').disabled = false;
      } catch (e) {
        $('modelsError').textContent = e.message;
        show($('modelsError'));
        $('model').innerHTML = '<option value="">获取失败</option>';
      } finally { $('fetchModelsBtn').disabled = false; }
    };

    $('generateFrameworkBtn').onclick = async () => {
      const design = getDesign();
      if (!design.goal) return $('setupError').textContent = '请输入研究目标。';
      currentConfig = getConfig();
      if (!currentConfig.apiKey) return $('setupError').textContent = '请填写 API Key。';
      if (!currentConfig.model) return $('setupError').textContent = '请先获取并选择模型。';
      $('setupError').textContent = '';
      $('generateFrameworkBtn').disabled = true;
      try {
        const { framework } = await api('/api/interview/framework', { method: 'POST', body: JSON.stringify({ ...currentConfig, ...design }) });
        currentFramework = framework;
        currentDesign = design;
        renderFramework(framework);
        hide($('setup'));
        show($('framework'));
      } catch (e) {
        $('setupError').textContent = e.message;
        show($('setupError'));
      } finally { $('generateFrameworkBtn').disabled = false; }
    };

    $('backToDesignBtn').onclick = () => {
      hide($('framework'));
      show($('setup'));
    };

    function renderFramework(fw) {
      $('frameworkPreview').innerHTML = (fw.topics || []).map(t => `
        <div class="topic-card">
          <h4>${escapeHtml(t.name)} <span style="color:var(--muted);font-weight:normal">(${escapeHtml(t.id)})</span></h4>
          <p>${escapeHtml(t.goal)}</p>
          <p>阶段：${escapeHtml(t.stage)} · 最少 ${Number(t.min_questions)} 轮 · 最多 ${Number(t.max_questions)} 轮</p>
        </div>
      `).join('');
      $('frameworkEditor').value = JSON.stringify(fw, null, 2);
    }

    function parseFramework() {
      const text = $('frameworkEditor').value.trim();
      if (!text) throw new Error('框架内容为空');
      return JSON.parse(text);
    }

    $('startBtn').onclick = async () => {
      try {
        currentFramework = parseFramework();
      } catch (e) {
        $('frameworkError').textContent = '框架 JSON 解析失败：' + e.message;
        show($('frameworkError'));
        return;
      }
      $('frameworkError').textContent = '';
      $('startBtn').disabled = true;
      try {
        const { id, message, topic_name, stage, action, reason, interviewEnded } = await api('/api/interview/start', { method: 'POST', body: JSON.stringify({ ...currentConfig, ...currentDesign, framework: currentFramework }) });
        sessionId = id;
        hide($('framework'));
        show($('chat'));
        appendMessage('assistant', message, { topic_name, stage, action, reason });
        if (interviewEnded) show($('endedNotice'));
      } catch (e) {
        $('frameworkError').textContent = e.message;
        show($('frameworkError'));
      } finally { $('startBtn').disabled = false; }
    };

    async function send() {
      const text = $('answer').value.trim();
      if (!text || !sessionId) return;
      $('answer').value = '';
      appendMessage('user', text);
      $('sendBtn').disabled = true;
      show($('typing'));
      try {
        const { message, topic_name, stage, action, reason, interviewEnded } = await api(`/api/interview/${sessionId}/message`, { method: 'POST', body: JSON.stringify({ text, apiKey: currentConfig.apiKey }) });
        appendMessage('assistant', message, { topic_name, stage, action, reason });
        if (interviewEnded) show($('endedNotice'));
      } catch (e) {
        $('chatError').textContent = e.message;
        show($('chatError'));
      } finally { hide($('typing')); $('sendBtn').disabled = false; $('answer').focus(); }
    }

    $('sendBtn').onclick = send;
    $('answer').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

    $('endBtn').onclick = async () => {
      $('endBtn').disabled = true;
      try {
        const data = await api(`/api/interview/${sessionId}/report`, { method: 'POST', body: JSON.stringify({ apiKey: currentConfig.apiKey }) });
        renderReport(data);
        hide($('chat'));
        show($('report'));
      } catch (e) {
        $('chatError').textContent = e.message;
        show($('chatError'));
      } finally { $('endBtn').disabled = false; }
    };

    $('newBtn').onclick = () => { location.reload(); };

    $('evalBtn').onclick = async () => {
      $('evalBtn').disabled = true;
      $('evalContent').textContent = '评估中…';
      try {
        const data = await api(`/api/interview/${sessionId}/evaluate`, { method: 'POST', body: JSON.stringify({ apiKey: currentConfig.apiKey }) });
        renderEvaluation(data.evaluation);
      } catch (e) {
        $('evalContent').textContent = e.message;
      } finally { $('evalBtn').disabled = false; }
    };

    function renderEvaluation(e) {
      const dims = {
        naturalness: '自然度',
        relevance: '相关性',
        probing: '追问质量',
        single_question: '单一问题',
        no_bias: '无偏见',
        progression: '节奏推进',
        ending: '自然结束',
        persona_fit: '画像契合'
      };
      const scores = e.scores || {};
      const html = [
        '<section class="eval-section"><h3>访谈质量评估</h3>',
        Object.entries(dims).map(([key, label]) => {
          const score = Number(scores[key]) || 0;
          const pct = (score / 5 * 100) + '%';
          return `<div class="score"><span>${label}</span><span>${score}/5</span></div><div class="score-bar-wrap"><div class="score-bar" style="width:${pct}"></div></div>`;
        }).join(''),
        `<div class="comment"><strong>总体评价</strong><p>${escapeHtml(e.overall_comment)}</p>`,
        `<strong>最大优点</strong><p>${escapeHtml(e.top_strength)}</p>`,
        `<strong>最大改进点</strong><p>${escapeHtml(e.top_weakness)}</p></div>`,
        '</section>'
      ].join('');
      $('evalContent').innerHTML = html;
    }

    function renderReport({ goal, report }) {
      const r = report;
      const html = [
        `<section><h3>研究目标</h3><p>${escapeHtml(goal)}</p></section>`,
        `<section><h3>摘要</h3><p>${escapeHtml(r.summary)}</p></section>`,
        `<section><h3>情绪</h3><p>${escapeHtml(r.sentiment)}</p></section>`,
        r.themes?.length ? `<section><h3>主题</h3>` + r.themes.map(t =>
          `<div><strong>${escapeHtml(t.name)}</strong><p>${escapeHtml(t.description)}</p>` +
          (t.quotes?.length ? t.quotes.map(q => `<div class="quote">"${escapeHtml(q)}"</div>`).join('') : '') + `</div>`
        ).join('') + `</section>` : '',
        r.insights?.length ? `<section><h3>洞察</h3><ul>` + r.insights.map(i =>
          `<li><strong>${escapeHtml(i.finding)}</strong> <span style="color:var(--muted)">— ${escapeHtml(i.evidence)}</span></li>`
        ).join('') + `</ul></section>` : '',
        r.recommendations?.length ? `<section><h3>建议</h3><ul>` + r.recommendations.map(x => `<li>${escapeHtml(x)}</li>`).join('') + `</ul></section>` : ''
      ].join('');
      $('reportContent').innerHTML = html;
    }

    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  </script>
</body>
</html>
