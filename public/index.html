<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights</title>
  <style>
    :root { --bg:#f7f6f3; --paper:#fff; --ink:#1f1f1f; --muted:#78736c; --line:#e5dfd7; --soft:#f1efeb; --yellow:#f5c400; --shadow:0 12px 30px rgba(16,16,16,.06); }
    * { box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; }
    body { margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(circle at 8% 8%, rgba(245,196,0,.18), transparent 28%); }
    .container { height:100vh; max-width:none; padding:12px; position:relative; }
    .layout { height:100%; display:grid; grid-template-columns:280px minmax(520px,1fr) 320px; gap:12px; }
    .sidebar, .stage, .rightbar { min-width:0; height:100%; display:flex; flex-direction:column; gap:12px; overflow:hidden; }
    .sidebar.collapsed, .rightbar.collapsed { display:none; }
    .brand { display:block; flex:0 0 auto; padding:4px 4px 0; }
    .brand img { width:174px; height:auto; display:block; }
    .card { background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); overflow:hidden; }
    .card::before { display:none; }
    #setup, #framework, #chat, #report { min-height:0; }
    #setup { flex:1; overflow:auto; }
    #framework { flex:0 0 44%; overflow:auto; }
    #chat { display:flex; flex-direction:column; min-height:420px; max-height:70vh; overflow:hidden; }
    #report { flex:1; overflow:auto; }
    h1 { margin:0 0 8px; font-size:1.45rem; line-height:1; letter-spacing:-.04em; }
    h3 { margin:16px 0 8px; font-size:.98rem; letter-spacing:-.02em; }
    .subtitle { margin:0 0 18px; color:var(--muted); font-size:.92rem; }
    label { display:block; margin:10px 0 6px; font-size:.86rem; font-weight:650; }
    textarea, input[type="text"], input[type="number"], select { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-size:.92rem; }
    textarea { min-height:70px; resize:vertical; }
    textarea:focus, input:focus, select:focus { outline:none; border-color:#111; box-shadow:0 0 0 3px rgba(245,196,0,.28); }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-size:.9rem; font-weight:650; cursor:pointer; transition:.12s ease; }
    .btn:hover:not(:disabled) { background:var(--soft); transform:translateY(-1px); }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn.secondary { background:#fff; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .row > * { flex:1; }
    .row > .btn { flex:0 0 auto; }
    .hidden { display:none !important; }
    .hint, .tiny, .msg-meta { color:var(--muted); font-size:.8rem; }
    .error { margin:10px 0; padding:10px; border:1px solid #ead77b; border-radius:10px; background:#fff8d8; color:#111; font-size:.88rem; }
    .progress, .ended-notice { margin-top:10px; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--soft); color:var(--muted); }
    .progress strong { display:block; color:var(--ink); margin-bottom:5px; }
    .progress-bar { height:6px; border-radius:99px; background:#e7e0d7; overflow:hidden; margin-top:8px; }
    .progress-bar span, .bar-track span, .score-bar { display:block; height:100%; border-radius:inherit; background:var(--yellow); }
    @keyframes progressPulse { to { width:88%; } }
    .progress-bar span { width:35%; animation:progressPulse 1.2s ease-in-out infinite alternate; }
    .chat { flex:1; display:flex; flex-direction:column; gap:10px; min-height:0; overflow:auto; padding:4px; }
    .msg { max-width:86%; padding:11px 13px; border:1px solid var(--line); border-radius:14px; white-space:pre-wrap; font-size:.94rem; }
    .msg.user { align-self:flex-end; background:#f5f3ef; border-bottom-right-radius:5px; }
    .msg.assistant { align-self:flex-start; background:#fff; border-bottom-left-radius:5px; }
    .input-area { display:flex; gap:8px; margin-top:10px; flex:0 0 auto; }
    .input-area textarea { flex:1; min-height:56px; max-height:110px; }
    .model-row { display:flex; gap:8px; align-items:flex-start; }
    .model-row select { flex:1; }
    .insight-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:10px 0; }
    .mini-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0; }
    .metric-card, .insight-card { padding:11px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .metric-value { font-size:1.45rem; line-height:1; font-weight:760; letter-spacing:-.04em; }
    .metric-label, .eyebrow { color:var(--muted); font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; }
    .pill-row { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 10px; }
    .pill { display:inline-flex; padding:5px 8px; border-radius:999px; border:1px solid #ead77b; background:#fff8d8; color:#111; font-size:.78rem; }
    .bar-list, .insight-list { display:grid; gap:8px; margin:10px 0; }
    .bar-item { display:grid; grid-template-columns:64px 1fr 34px; gap:8px; align-items:center; font-size:.82rem; }
    .bar-track { height:7px; border-radius:99px; background:#e7e0d7; overflow:hidden; }
    .quick-summary { margin:6px 0 10px; font-size:.98rem; line-height:1.4; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:.78rem; }
    th,td { text-align:left; padding:8px; border-top:1px solid var(--line); vertical-align:top; }
    summary { cursor:pointer; list-style:none; font-weight:650; }
    summary::-webkit-details-marker { display:none; }
    .quote { margin-top:8px; padding-left:8px; border-left:3px solid var(--yellow); color:var(--muted); font-size:.84rem; }
    @media (max-width:980px) { html, body { overflow:auto; } .container { height:auto; min-height:100vh; } .layout { height:auto; grid-template-columns:1fr; } .sidebar,.stage,.rightbar { height:auto; overflow:visible; } #setup,#framework,#chat,#report { overflow:visible; } .chat { max-height:none; overflow:visible; } .input-area,.model-row { flex-direction:column; } .btn { width:100%; } .insight-grid,.mini-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="container">
    <header class="brand" aria-label="Oliver Wyman">
      <img src="/OliverWyman-logo-2021.jpg" alt="Oliver Wyman" />
      <div class="row" style="margin-top:8px; gap:6px">
        <button id="toggleLeftBtn" class="btn secondary" style="font-size:.75rem; padding:4px 8px">Hide left</button>
        <button id="toggleRightBtn" class="btn secondary" style="font-size:.75rem; padding:4px 8px">Hide right</button>
      </div>
    </header>

    <div id="setup" class="card">
      <h1>Insights</h1>
      <p class="subtitle">用 AI 主持深度访谈，先设计研究框架，再自然追问、收尾并生成洞察报告。</p>

      <label for="provider">模型提供商</label>
      <select id="provider">
        <option value="openai">OpenAI / OpenAI 兼容</option>
        <option value="anthropic">Anthropic</option>
        <option value="custom">自定义 OpenAI 兼容端点</option>
      </select>
      <p class="hint">Anthropic 将自动使用 /messages，其余兼容端点使用 /chat/completions。</p>

      <label for="baseUrl" style="margin-top:12px">API 地址（可选）</label>
      <input type="text" id="baseUrl" placeholder="留空使用默认地址" />

      <label for="apiKey" style="margin-top:12px">API Key</label>
      <input type="text" id="apiKey" placeholder="sk-... 或 anthropic 的 key" />
      <p class="hint">仅在请求中临时使用，不会保存到服务器。</p>

      <div class="model-row" style="margin-top:12px">
        <div style="flex:1">
          <label for="model">模型</label>
          <select id="model" disabled><option value="">先点击“获取模型”</option></select>
        </div>
        <button id="fetchModelsBtn" class="btn" style="margin-top:23px">获取模型</button>
      </div>
      <div id="modelsError" class="error hidden"></div>

      <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--border)">
        <h3 style="margin:0 0 12px; font-size:1rem">研究设计</h3>
        <label for="goal">研究目标</label>
        <textarea id="goal" placeholder="例如：了解用户为什么在新手引导阶段流失"></textarea>

        <label for="methodology" style="margin-top:12px">方法学</label>
        <select id="methodology">
          <option value="general">通用</option>
          <option value="JTBD">Jobs-to-be-Done</option>
          <option value="5whys">五问法（5 Whys）</option>
          <option value="star">STAR</option>
          <option value="persona">Persona 画像</option>
        </select>

        <label for="targetAudience" style="margin-top:12px">目标受众</label>
        <textarea id="targetAudience" placeholder="例如：25-35 岁一线城市 SaaS 产品经理，每天使用 3+ 工具"></textarea>

        <label for="scenarios" style="margin-top:12px">研究场景</label>
        <textarea id="scenarios" placeholder="例如：首次注册、付费决策、流失前最后一次登录"></textarea>

        <label for="persona" style="margin-top:12px">受访者画像 / 上下文</label>
        <textarea id="persona" placeholder="例如：时间紧张、关注 ROI、对数据敏感"></textarea>
      </div>

      <div class="row" style="margin-top:16px">
        <button id="generateFrameworkBtn" class="btn" disabled>生成访谈框架</button>
      </div>
      <div id="setupProgress" class="progress hidden">
        <strong id="setupProgressTitle">正在生成访谈框架…</strong>
        <div id="setupProgressText">正在分析研究目标、受众和场景。</div>
        <div class="progress-bar" style="margin-top:10px"><span></span></div>
      </div>
      <div id="setupError" class="error hidden"></div>
    </div>

    </div>
      </aside>
      <main class="stage main-stack">
      <h1>研究框架</h1>
      <p class="subtitle">AI 根据研究设计生成的访谈话题。你可以直接修改每个话题块的名称、目标、阶段和问题范围。</p>
      <div id="frameworkPreview"></div>
      <label style="margin-top:16px">框架块</label>
      <div id="frameworkBlocks"></div>
      <div id="frameworkError" class="error hidden"></div>
      <div class="row" style="margin-top:16px">
        <button id="backToDesignBtn" class="btn secondary">返回修改设计</button>
        <button id="startBtn" class="btn">开始访谈</button>
      </div>
      <div id="frameworkError" class="error hidden"></div>
    </div>

    <div id="chat" class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:12px">
        <h1 style="font-size:1.25rem">访谈</h1>
        <button id="endBtn" class="btn secondary">结束并生成报告</button>
      </div>
      <div id="endedNotice" class="ended-notice hidden">
        访谈已自然结束。你可以查看报告，或继续补充回答。
      </div>
      <div id="messages" class="chat"></div>
      <div id="typing" class="hidden" style="color:var(--muted); padding:8px 0">主持人正在理解你的回答，检查是否需要追问或换话题…</div>
      <div class="input-area">
        <textarea id="answer" placeholder="输入你的回答…"></textarea>
        <button id="sendBtn" class="btn">发送</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="nextQuestionBtn" class="btn secondary hidden">下一个问题</button>
      </div>
      <div id="chatError" class="error hidden"></div>
    </div>

    </main>
      <aside class="rightbar main-stack">
        <div id="report" class="card compact-card report">
      <div class="row" style="justify-content:space-between; margin-bottom:16px">
        <h1>洞察报告</h1>
        <div class="row" style="flex:0 0 auto">
          <button id="downloadCsvBtn" class="btn secondary">下载 CSV</button>
          <button id="evalBtn" class="btn secondary">评估访谈</button>
          <button id="newBtn" class="btn secondary">新建访谈</button>
        </div>
      </div>
      <div id="evalContent"></div>
      <details id="transcriptDetails" class="insight-card" style="margin-top:16px">
        <summary style="cursor:pointer;font-weight:600">查看访谈内容</summary>
        <div id="transcriptTable"></div>
      </details>
      <div id="reportContent"></div>
    </div>
      </aside>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let sessionId = null;
    let currentConfig = {};
    let currentDesign = {};
    let currentFramework = null;
    let transcriptRows = [];
    let sidebarCollapsed = false;

    async function api(url, opts = {}) {
      const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function show(el) { el.classList.remove('hidden'); }
    function hide(el) { el.classList.add('hidden'); }

    let progressTimer = null;

    function showProgress(scope, steps) {
      let i = 0;
      $('setupProgressTitle').textContent = scope === 'setup' ? '正在生成访谈框架…' : '正在生成下一个问题…';
      $('setupProgressText').textContent = steps[0];
      show($('setupProgress'));
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        i = Math.min(i + 1, steps.length - 1);
        $('setupProgressText').textContent = steps[i];
      }, 1800);
    }

    function hideProgress() {
      clearInterval(progressTimer);
      progressTimer = null;
      hide($('setupProgress'));
    }

    function appendMessage(role, text, meta = {}) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      let html = escapeHtml(text);
      if (role === 'assistant' && (meta.topic_name || meta.stage || meta.action || meta.reason)) {
        html += `<div class="msg-meta">`;
        const parts = [];
        if (meta.topic_name) parts.push(`话题：${escapeHtml(meta.topic_name)}`);
        if (meta.stage) parts.push(`阶段：${escapeHtml(meta.stage)}`);
        if (meta.action) parts.push(`动作：${escapeHtml(meta.action)}`);
        if (parts.length) html += parts.join(' · ');
        if (meta.reason) html += `<br>理由：${escapeHtml(meta.reason)}`;
        html += `</div>`;
      }
      div.innerHTML = html;
      $('messages').appendChild(div);
      $('messages').scrollTop = $('messages').scrollHeight;
      transcriptRows.push({ role, text, meta, ts: new Date().toISOString() });
    }

    function getConfig() {
      return {
        provider: $('provider').value,
        baseUrl: $('baseUrl').value.trim(),
        apiKey: $('apiKey').value.trim(),
        model: $('model').value,
      };
    }

    function getDesign() {
      return {
        goal: $('goal').value.trim(),
        methodology: $('methodology').value,
        targetAudience: $('targetAudience').value.trim(),
        scenarios: $('scenarios').value.trim(),
        persona: $('persona').value.trim(),
      };
    }

    $('fetchModelsBtn').onclick = async () => {
      const cfg = getConfig();
      if (!cfg.apiKey) { $('modelsError').textContent = '请先填写 API Key。'; return show($('modelsError')); }
      $('fetchModelsBtn').disabled = true;
      hide($('modelsError'));
      $('model').innerHTML = '<option value="">加载中…</option>';
      $('model').disabled = true;
      try {
        const { models } = await api('/api/models', { method: 'POST', body: JSON.stringify(cfg) });
        if (!models.length) throw new Error('未获取到可用模型');
        $('model').innerHTML = models.map(m => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.id)}</option>`).join('');
        $('model').disabled = false;
        $('generateFrameworkBtn').disabled = false;
      } catch (e) {
        $('modelsError').textContent = e.message;
        show($('modelsError'));
        $('model').innerHTML = '<option value="">获取失败</option>';
      } finally { $('fetchModelsBtn').disabled = false; }
    };

    $('generateFrameworkBtn').onclick = async () => {
      const design = getDesign();
      if (!design.goal) { $('setupError').textContent = '请输入研究目标。'; return show($('setupError')); }
      currentConfig = getConfig();
      if (!currentConfig.apiKey) { $('setupError').textContent = '请填写 API Key。'; return show($('setupError')); }
      if (!currentConfig.model) { $('setupError').textContent = '请先获取并选择模型。'; return show($('setupError')); }
      $('setupError').textContent = '';
      hide($('setupError'));
      showProgress('setup', ['正在分析研究目标、受众和场景。', '正在拆分话题和追问边界。', '正在整理可编辑的话题块。']);
      $('generateFrameworkBtn').disabled = true;
      try {
        const { framework } = await api('/api/interview/framework', { method: 'POST', body: JSON.stringify({ ...currentConfig, ...design }) });
        currentFramework = framework;
        currentDesign = design;
        renderFramework(framework);
        show($('framework'));
      } catch (e) {
        $('setupError').textContent = e.message;
        show($('setupError'));
      } finally { hideProgress(); $('generateFrameworkBtn').disabled = false; }
    };

    $('backToDesignBtn').onclick = () => {

    };

    function renderFramework(fw) {
      currentFramework = fw;
      currentDesign = currentDesign || getDesign();
      $('frameworkPreview').innerHTML = renderFrameworkPreview(fw);
      $('frameworkBlocks').innerHTML = renderFrameworkBlocks(fw);
      bindFrameworkEditors();
    }

    function renderFrameworkPreview(fw) {
      const topics = fw.topics || [];
      return [
        '<div class="insight-grid">',
        `<div class="metric-card"><div class="metric-value">${topics.length}</div><div class="metric-label">话题</div></div>`,
        `<div class="metric-card"><div class="metric-value">${fw.estimatedTurns || '-'}</div><div class="metric-label">预计轮数</div></div>`,
        `<div class="metric-card"><div class="metric-value">${(fw.endingCriteria || []).length}</div><div class="metric-label">结束条件</div></div>`,
        '</div>',
        `<div class="insight-card"><div class="eyebrow">一眼看懂</div><p class="quick-summary">${escapeHtml(topics[0]?.goal || '暂无主题')}</p></div>`,
        fw.endingCriteria?.length ? `<div class="pill-row">${fw.endingCriteria.slice(0, 4).map(x => `<span class="pill">${escapeHtml(x)}</span>`).join('')}</div>` : ''
      ].join('');
    }

    function renderFrameworkBlocks(fw) {
      const topics = fw.topics || [];
      return [
        '<div class="insight-list">',
        ...topics.map((t, i) => `
          <div class="insight-card framework-block" data-index="${i}">
            <div class="row" style="align-items:flex-start; gap:10px">
              <div style="flex:1">
                <div class="eyebrow">话题 ${i + 1}</div>
                <input type="text" data-field="name" value="${escapeAttr(t.name)}" aria-label="话题名称" />
                <textarea data-field="goal" style="margin-top:10px">${escapeHtml(t.goal || '')}</textarea>
                <div class="row" style="margin-top:10px">
                  <select data-field="stage">
                    ${['introduce','explore','probe','confirm'].map(s => `<option value="${s}" ${s === t.stage ? 'selected' : ''}>${stageLabel(s)}</option>`).join('')}
                  </select>
                  <input type="number" min="1" step="1" data-field="min_questions" value="${Number(t.min_questions || 1)}" aria-label="最少问题数" />
                  <input type="number" min="1" step="1" data-field="max_questions" value="${Number(t.max_questions || 1)}" aria-label="最多问题数" />
                </div>
                <textarea data-field="focus_prompt" style="margin-top:10px">${escapeHtml(t.focus_prompt || '')}</textarea>
              </div>
            </div>
          </div>
        `).join(''),
        '</div>',
        '<div class="insight-card" style="margin-top:14px"><div class="eyebrow">结束条件</div><div id="endingCriteriaList"></div></div>'
      ].join('');
    }

    function bindFrameworkEditors() {
      $('frameworkBlocks').querySelectorAll('.framework-block').forEach(block => {
        const index = Number(block.dataset.index);
        block.querySelectorAll('[data-field]').forEach(el => {
          const field = el.dataset.field;
          const evt = el.tagName === 'SELECT' || el.type === 'number' ? 'change' : 'input';
          el.addEventListener(evt, () => {
            const topic = currentFramework.topics[index];
            topic[field] = el.type === 'number' ? Number(el.value || 0) : el.value;
            if (field === 'min_questions' || field === 'max_questions') {
              topic[field] = Math.max(1, Number(el.value || 1));
            }
          });
        });
      });
      const endingHost = $('endingCriteriaList');
      if (endingHost) {
        endingHost.innerHTML = (currentFramework.endingCriteria || []).map((item, i) => `
          <div class="row" style="margin-top:${i ? '8px' : '0'}">
            <input type="text" data-ending-index="${i}" value="${escapeAttr(item)}" />
          </div>
        `).join('');
        endingHost.querySelectorAll('[data-ending-index]').forEach(input => {
          input.addEventListener('input', () => {
            currentFramework.endingCriteria[input.dataset.endingIndex] = input.value;
          });
        });
      }
    }

    function stageLabel(s) {
      return { introduce: 'introduce', explore: 'explore', probe: 'probe', confirm: 'confirm' }[s] || s;
    }

    function escapeAttr(s) { return String(s).replace(/[&"]/g, c => ({'&':'&amp;','"':'&quot;'}[c])); }


    $('startBtn').onclick = async () => {
      try {
        currentFramework = structuredClone(currentFramework);
      } catch {
        currentFramework = JSON.parse(JSON.stringify(currentFramework));
      }
      if (!currentFramework || !currentFramework.topics?.length) { $('frameworkError').textContent = '框架内容为空'; show($('frameworkError')); return; }
      $('startBtn').disabled = true;
      try {
        const { id, message, topic_name, stage, action, reason, interviewEnded } = await api('/api/interview/start', { method: 'POST', body: JSON.stringify({ ...currentConfig, ...currentDesign, framework: currentFramework }) });
        sessionId = id;
        show($('chat'));
        show($('nextQuestionBtn'));
        show($('downloadCsvBtn'));
        appendMessage('assistant', message, { topic_name, stage, action, reason });
        if (interviewEnded) { show($('endedNotice')); hide($('nextQuestionBtn')); }
      } catch (e) {
        $('frameworkError').textContent = e.message;
        show($('frameworkError'));
      } finally { $('startBtn').disabled = false; }
    };

    async function send() {
      const text = $('answer').value.trim();
      if (!text || !sessionId) return;
      $('answer').value = '';
      appendMessage('user', text);
      $('sendBtn').disabled = true;
      show($('typing'));
      try {
        const { message, topic_name, stage, action, reason, interviewEnded } = await api(`/api/interview/${sessionId}/message`, { method: 'POST', body: JSON.stringify({ text, apiKey: currentConfig.apiKey }) });
        appendMessage('assistant', message, { topic_name, stage, action, reason });
        if (interviewEnded) { show($('endedNotice')); hide($('nextQuestionBtn')); }
      } catch (e) {
        $('chatError').textContent = e.message;
        show($('chatError'));
      } finally { hide($('typing')); $('sendBtn').disabled = false; $('answer').focus(); }
    }

    $('sendBtn').onclick = send;
    $('toggleLeftBtn').onclick = toggleLeft;
    $('toggleRightBtn').onclick = toggleRight;
    $('nextQuestionBtn').onclick = async () => { $('answer').value = '继续'; await send(); };
    $('downloadCsvBtn').onclick = downloadCsv;
    $('answer').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

    $('endBtn').onclick = async () => {
      $('endBtn').disabled = true;
      try {
        const data = await api(`/api/interview/${sessionId}/report`, { method: 'POST', body: JSON.stringify({ apiKey: currentConfig.apiKey }) });
        renderReport(data);
        renderTranscriptTable();
        show($('report'));
      } catch (e) {
        $('chatError').textContent = e.message;
        show($('chatError'));
      } finally { $('endBtn').disabled = false; }
    };

    $('newBtn').onclick = () => { location.reload(); };

    $('evalBtn').onclick = async () => {
      $('evalBtn').disabled = true;
      $('evalContent').textContent = '评估中…';
      try {
        const data = await api(`/api/interview/${sessionId}/evaluate`, { method: 'POST', body: JSON.stringify({ apiKey: currentConfig.apiKey }) });
        renderEvaluation(data.evaluation);
      } catch (e) {
        $('evalContent').textContent = e.message;
      } finally { $('evalBtn').disabled = false; }
    };

    function renderEvaluation(e) {
      const dims = {
        naturalness: '自然度',
        relevance: '相关性',
        probing: '追问',
        single_question: '单问',
        no_bias: '中立',
        progression: '节奏',
        ending: '收尾',
        persona_fit: '契合'
      };
      const scores = e.scores || {};
      const vals = Object.keys(dims).map(k => Number(scores[k]) || 0);
      const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      const weak = Object.entries(dims).sort(([a], [b]) => (scores[a] || 0) - (scores[b] || 0)).slice(0, 3).map(([, label]) => label);
      const strong = Object.entries(dims).sort(([a], [b]) => (scores[b] || 0) - (scores[a] || 0)).slice(0, 3).map(([, label]) => label);
      const html = [
        '<section class="eval-section">',
        '<div class="eyebrow">Interview quality</div>',
        '<div class="insight-grid">',
        `<div class="metric-card"><div class="metric-value">${avg.toFixed(1)}</div><div class="metric-label">平均分 / 5</div></div>`,
        `<div class="metric-card"><div class="metric-value">${strong[0] || '-'}</div><div class="metric-label">最强维度</div></div>`,
        `<div class="metric-card"><div class="metric-value">${weak[0] || '-'}</div><div class="metric-label">优先优化</div></div>`,
        '</div>',
        `<p class="quick-summary">${escapeHtml(e.overall_comment || '暂无总体评价')}</p>`,
        '<div class="pill-row">',
        ...strong.map(x => `<span class="pill">优势：${escapeHtml(x)}</span>`),
        ...weak.map(x => `<span class="pill">改进：${escapeHtml(x)}</span>`),
        '</div>',
        '<div class="bar-list">',
        Object.entries(dims).map(([key, label]) => {
          const score = Number(scores[key]) || 0;
          const pct = Math.max(0, Math.min(100, score / 5 * 100));
          return `<div class="bar-item"><span>${label}</span><div class="bar-track"><span style="width:${pct}%"></span></div><strong>${score}/5</strong></div>`;
        }).join(''),
        '</div>',
        '<div class="insight-grid">',
        `<div class="insight-card"><div class="eyebrow">最大优点</div><strong>${escapeHtml(e.top_strength || '暂无')}</strong></div>`,
        `<div class="insight-card"><div class="eyebrow">最大改进点</div><strong>${escapeHtml(e.top_weakness || '暂无')}</strong></div>`,
        `<div class="insight-card"><div class="eyebrow">关键词</div><div class="pill-row">${keywordsFromText([e.overall_comment, e.top_strength, e.top_weakness].join(' ')).map(k => `<span class="pill">${escapeHtml(k)}</span>`).join('')}</div></div>`,
        '</div>',
        '</section>'
      ].join('');
      $('evalContent').innerHTML = html;
    }

    function renderReport({ goal, report }) {
      const r = report;
      const themeNames = (r.themes || []).map(t => t.name).filter(Boolean);
      const insightNames = (r.insights || []).map(i => i.finding).filter(Boolean);
      const keywords = keywordsFromText([goal, r.summary, r.sentiment, ...themeNames, ...insightNames].join(' '));
      const html = [
        '<section>',
        '<div class="eyebrow">Research goal</div>',
        `<p class="quick-summary">${escapeHtml(goal)}</p>`,
        '<div class="insight-grid">',
        `<div class="metric-card"><div class="metric-value">${(r.themes || []).length}</div><div class="metric-label">主题</div></div>`,
        `<div class="metric-card"><div class="metric-value">${(r.insights || []).length}</div><div class="metric-label">洞察</div></div>`,
        `<div class="metric-card"><div class="metric-value">${(r.recommendations || []).length}</div><div class="metric-label">建议</div></div>`,
        '</div>',
        `<div class="insight-card"><div class="eyebrow">一句话摘要</div><p class="quick-summary">${escapeHtml(r.summary || '暂无摘要')}</p></div>`,
        keywords.length ? `<div class="pill-row">${keywords.map(k => `<span class="pill">${escapeHtml(k)}</span>`).join('')}</div>` : '',
        r.sentiment ? `<div class="insight-card"><div class="eyebrow">情绪 / 动机线索</div><strong>${escapeHtml(r.sentiment)}</strong></div>` : '',
        r.themes?.length ? '<h3>主题地图</h3><div class="insight-grid">' + r.themes.map(t => { const quote = t.quotes?.[0] ? `<div class="tiny">${escapeHtml(t.quotes[0])}</div>` : ''; return `<div class="insight-card"><strong>${escapeHtml(t.name)}</strong><div class="tiny">${escapeHtml(t.description)}</div>${quote}</div>`; }).join('') + '</div>' : '',
        r.insights?.length ? '<h3>关键洞察</h3><div class="insight-list">' + r.insights.map(i => `<div class="insight-card"><strong>${escapeHtml(i.finding)}</strong><div class="tiny">${escapeHtml(i.evidence)}</div></div>`).join('') + '</div>' : '',
        r.recommendations?.length ? '<h3>下一步建议</h3><div class="mini-grid">' + r.recommendations.slice(0,4).map(x => `<div class="insight-card">${escapeHtml(x)}</div>`).join('') + '</div>' : '',
        '</section>'
      ].join('');
      $('reportContent').innerHTML = html;
    }

    function toggleLeft() {
      const left = document.querySelector('.sidebar');
      if (!left) return;
      left.classList.toggle('collapsed');
      $('toggleLeftBtn').textContent = left.classList.contains('collapsed') ? 'Show left' : 'Hide left';
    }
    function toggleRight() {
      const right = document.querySelector('.rightbar');
      if (!right) return;
      right.classList.toggle('collapsed');
      $('toggleRightBtn').textContent = right.classList.contains('collapsed') ? 'Show right' : 'Hide right';
    }

    function keywordsFromText(text) {
      const stop = new Set(['一个','一些','这个','那个','目前','进行','使用','访谈','问题','用户','可以','需要','因为','所以','但是','以及','是否','没有','时候','总体','最大','优点','改进点','评价','the','and','with']);
      return Array.from(String(text).match(/[\u4e00-\u9fa5]{2,6}|[A-Za-z][A-Za-z-]{2,}/g) || [])
        .map(x => x.trim())
        .filter(x => !stop.has(x.toLowerCase()))
        .filter((x, i, a) => a.indexOf(x) === i)
        .slice(0, 10);
    }


    function renderTranscriptTable() {
      $('transcriptTable').innerHTML = `
        <table>
          <thead><tr><th>角色</th><th>内容</th><th>话题</th><th>阶段</th></tr></thead>
          <tbody>${transcriptRows.map(r => `<tr><td>${escapeHtml(r.role === 'assistant' ? '主持人' : '受访者')}</td><td>${escapeHtml(r.text)}</td><td>${escapeHtml(r.meta?.topic_name || '')}</td><td>${escapeHtml(r.meta?.stage || '')}</td></tr>`).join('')}</tbody>
        </table>
      `;
    }

    function downloadCsv() {
      const rows = [['role','text','topic','stage','time']].concat(transcriptRows.map(r => [r.role, r.text, r.meta?.topic_name || '', r.meta?.stage || '', r.ts || '']));
      const csv = rows.map(cols => cols.map(v => `"${String(v).replaceAll('"', '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'interview-transcript.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  </script>
</body>
</html>
