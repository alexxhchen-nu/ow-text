<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insights</title>
  <link rel="icon" href="data:," />
  <script src="/i18n.js"></script>
  <style>
    :root{--bg:#09090d;--panel:#111118;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.07);--ink:#f6f7fb;--muted:#a1a1ae;--line:rgba(255,255,255,.1);--violet:#7c3aed;--cyan:#06b6d4;--red:#fb7185;--radius:20px}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,rgba(124,58,237,.2),transparent 28%),radial-gradient(circle at 90% 5%,rgba(6,182,212,.14),transparent 26%),var(--bg)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{max-width:1120px;min-height:100vh;margin:auto;padding:18px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.04em}.brand img{height:28px;width:auto}.langs,.steps{display:flex;gap:5px;padding:5px;border:1px solid var(--line);border-radius:999px;background:var(--card)}.langs button,.step{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font-size:12px;font-weight:750}.langs button{cursor:pointer}.langs button.active,.step.active{background:linear-gradient(135deg,var(--violet),var(--cyan));color:#fff}.steps{justify-content:center;flex-wrap:wrap;margin:20px auto;max-width:760px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.28);backdrop-filter:blur(18px)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:-.06em;margin-bottom:12px}h2{font-size:21px;letter-spacing:-.03em}.muted,.hint{color:var(--muted)}.hint{font-size:12px;margin:5px 0 0}.eyebrow{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.14em;text-transform:uppercase}.grid{display:grid;gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:block;font-size:12px;font-weight:750;margin:12px 0 6px;color:#e9eaf0}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);outline:0;padding:11px 12px}textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.18)}.service{border:1px solid var(--line);border-radius:16px;background:var(--card2);padding:16px}.service-head,.bar,.actions,.message-audio{display:flex;align-items:center;justify-content:space-between;gap:10px}.service h3{font-size:16px;margin:0}.btn{border:0;border-radius:999px;padding:10px 15px;color:#fff;background:linear-gradient(135deg,var(--violet),var(--cyan));cursor:pointer;font-weight:750;font-size:13px;transition:.15s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 26px rgba(124,58,237,.3)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:var(--card2);border:1px solid var(--line);color:var(--ink)}.btn.danger{background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.35);color:#fda4af}.icon{width:42px;height:42px;padding:0;display:grid;place-items:center}.icon.recording{border-color:var(--red);color:#fda4af;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.5}}details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:750}.error{margin-top:12px;padding:10px 12px;border:1px solid rgba(251,113,133,.35);border-radius:12px;background:rgba(251,113,133,.12);color:#fda4af;font-size:13px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(9,9,13,.82);backdrop-filter:blur(8px);z-index:10;opacity:0;pointer-events:none;transition:.2s}.overlay.active{opacity:1;pointer-events:auto}.overlay .card{max-width:400px;text-align:center}.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));transition:width .3s}.choice{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:22px;text-align:left;cursor:pointer;transition:.15s}.choice:hover{transform:translateY(-2px);border-color:var(--violet);background:var(--card2)}.choice strong{display:block;font-size:17px;margin-bottom:5px}.chat-shell{display:flex;flex-direction:column;gap:12px;min-height:66vh}.chat{flex:1;min-height:360px;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card2)}.msg{max-width:80%;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);white-space:pre-wrap}.msg.user{align-self:end;border:0;background:linear-gradient(135deg,var(--violet),var(--cyan));border-bottom-right-radius:5px}.msg.assistant{align-self:start;border-bottom-left-radius:5px}.meta{font-size:11px;color:var(--muted);margin-top:7px}.message-audio{margin-top:10px;justify-content:start}.message-audio audio{width:220px;height:32px}.composer{display:flex;gap:9px;align-items:end}.composer textarea{min-height:58px;flex:1}.partial{min-height:18px;color:var(--muted);font-size:12px}.notice{padding:11px;border-radius:12px;border:1px solid var(--line);color:var(--muted);background:var(--card2)}.metric{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card2)}.metric b{display:block;font-size:24px;letter-spacing:-.04em}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.pill{display:inline-block;padding:5px 9px;margin:3px;border:1px solid rgba(124,58,237,.35);border-radius:99px;color:#c4b5fd;background:rgba(124,58,237,.13);font-size:12px}.list{display:grid;gap:9px}.quote{border-left:2px solid var(--violet);padding-left:9px;color:var(--muted);font-size:13px}.barrow{display:grid;grid-template-columns:85px 1fr 40px;gap:9px;align-items:center;font-size:12px}.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.track span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}.table-wrap{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}th{position:sticky;top:0;background:var(--panel);color:var(--muted)}.respondent .interviewer-only,.respondent .steps{display:none!important}@media(max-width:760px){.shell{padding:12px}.grid.two,.grid.three{grid-template-columns:1fr}.composer{flex-wrap:wrap}.msg{max-width:94%}.top{align-items:flex-start}.steps{border-radius:18px}.step{padding:6px 9px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand"><img src="/OliverWyman-logo-2021.jpg" alt="Oliver Wyman"><span>Insights</span></div><div class="langs"><button class="active" data-lang="en">English</button><button data-lang="zh">中文</button></div></header>
    <nav class="steps"><span class="step active" data-step="setup">1 <i></i></span><span class="step" data-step="framework">2 <i></i></span><span class="step" data-step="role">3 <i></i></span><span class="step" data-step="chat">4 <i></i></span><span class="step" data-step="report">5 <i></i></span></nav>
    <div id="overlay" class="overlay"><div class="card"><div class="eyebrow">Insights</div><h2 id="overlayTitle"></h2><p id="overlayText" class="muted"></p><div class="progress"><span id="overlayBar"></span></div></div></div>
    <section id="setup" class="card">
      <div class="eyebrow">Voice research</div><h1 data-copy="setup.title"></h1><p class="muted" data-copy="appSubtitle"></p>
      <div id="services" class="grid"></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
      <div class="eyebrow" data-copy="setup.title"></div>
      <label data-copy="setup.goalLabel"></label><textarea id="goal"></textarea>
      <div class="grid two"><div><label data-copy="setup.methodologyLabel"></label><select id="methodology"><option value="general">General</option><option value="JTBD">Jobs-to-be-Done</option><option value="5whys">5 Whys</option><option value="star">STAR</option><option value="persona">Persona</option></select></div><div><label data-copy="setup.targetAudienceLabel"></label><textarea id="targetAudience"></textarea></div></div>
      <div class="grid two"><div><label data-copy="setup.scenariosLabel"></label><textarea id="scenarios"></textarea></div><div><label data-copy="setup.personaLabel"></label><textarea id="persona"></textarea></div></div>
      <div class="actions" style="margin-top:18px"><button id="generateBtn" class="btn" data-copy="setup.generateFramework"></button></div><div id="setupError" class="error hidden"></div>
    </section>
    <section id="framework" class="card hidden"><div class="eyebrow">Research design</div><h2 data-copy="framework.title"></h2><p class="muted" data-copy="framework.subtitle"></p><div id="frameworkStats" class="grid three"></div><div id="frameworkHost" class="list" style="margin-top:14px"></div><div id="frameworkError" class="error hidden"></div><div class="actions" style="margin-top:18px"><button id="backBtn" class="btn secondary" data-copy="framework.backToSetup"></button><button id="startBtn" class="btn" data-copy="framework.startInterview"></button></div></section>
    <section id="role" class="card hidden"><div class="eyebrow">Role</div><h1 data-copy="role.title"></h1><p class="muted" data-copy="role.subtitle"></p><div class="grid two"><button id="respondentBtn" class="choice"><strong data-copy="role.respondent"></strong><span data-copy="role.respondentDesc"></span></button><button id="interviewerBtn" class="choice"><strong data-copy="role.interviewer"></strong><span data-copy="role.interviewerDesc"></span></button></div></section>
    <section id="chat" class="card hidden"><div class="bar"><div><div class="eyebrow">Live interview</div><h2 data-copy="chat.title"></h2></div><div class="actions interviewer-only"><button id="muteBtn" class="btn secondary"></button><button id="endBtn" class="btn danger" data-copy="chat.end"></button></div></div><div id="endedNotice" class="notice hidden"></div><div class="chat-shell"><div id="messages" class="chat"></div><div id="partial" class="partial"></div><div id="chatError" class="error hidden"></div><div class="composer"><textarea id="answer"></textarea><button id="recordBtn" class="btn secondary icon" title="Record">●</button><button id="sendBtn" class="btn" data-copy="chat.send"></button></div><button id="nextBtn" class="btn secondary interviewer-only hidden" data-copy="chat.nextQuestion"></button></div></section>
    <section id="thanks" class="card hidden" style="text-align:center;padding:80px 24px"><div class="eyebrow" data-copy="thanks.eyebrow"></div><h1 data-copy="thanks.title"></h1><p class="muted" data-copy="thanks.subtitle"></p></section>
    <section id="report" class="card hidden"><div class="bar"><div><div class="eyebrow">Evidence</div><h2 data-copy="report.title"></h2></div><div class="actions interviewer-only"><button id="csvBtn" class="btn secondary" data-copy="report.downloadCsv"></button><button id="evalBtn" class="btn secondary" data-copy="report.evaluate"></button><button id="newBtn" class="btn secondary" data-copy="report.newInterview"></button></div></div><div id="evalHost"></div><div id="reportHost"></div><details style="margin-top:18px"><summary data-copy="report.transcript"></summary><div id="transcriptHost" class="table-wrap" style="margin-top:12px"></div></details></section>
  </div>
  <script>
    const $=id=>document.getElementById(id);const state={lang:'en',sessionId:null,framework:null,mode:'interviewer',rows:[],mute:false,recorder:null,chunks:[],timer:null,busySTT:false,cfg:{chat:{protocol:'openai-compatible',baseUrl:'',apiKey:'',model:''},stt:{protocol:'openai-compatible',baseUrl:'',apiKey:'',model:'',language:'en'},tts:{protocol:'openai-compatible',baseUrl:'',apiKey:'',model:'',voice:'alloy',speed:'1'}}};
    const tr=(key,fallback='')=>window.t?window.t(key,state.lang,fallback):fallback||key;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function setPhase(id){['setup','framework','role','chat','thanks','report'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.step').forEach((el,i)=>{const steps=['setup','framework','role','chat','report'];el.classList.toggle('active',el.dataset.step===id);el.classList.toggle('done',steps.indexOf(id)>i)})}
    function serviceOptions(name){const chat=name==='chat';return Object.entries(tr('protocol')).filter(([k])=>chat||k!=='anthropic-compatible').map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}
    function providerCard(name,title,advanced){const c=state.cfg[name];return `<article class="service"><div class="service-head"><h3>${esc(title)}</h3>${name!=='chat'?`<button class="btn secondary copy-chat" data-service="${name}">${esc(tr('provider.useSameAsChat'))}</button>`:`<button id="modelsBtn" class="btn secondary">${esc(tr('provider.fetchModels'))}</button>`}</div><div class="grid two"><div><label>${esc(tr('provider.protocol'))}</label><select id="${name}-protocol">${serviceOptions(name)}</select></div><div><label>${esc(tr('provider.model'))}</label><input id="${name}-model" list="chatModels" value="${esc(c.model)}" placeholder="${name==='stt'?'whisper-1':name==='tts'?'tts-1':'gpt-4o-mini'}"></div></div><label>${esc(tr('provider.baseUrl'))}</label><input id="${name}-baseUrl" value="${esc(c.baseUrl)}" placeholder="https://.../v1"><label>${esc(tr('provider.apiKey'))}</label><input id="${name}-apiKey" type="password" value="${esc(c.apiKey)}" placeholder="${name==='chat'?'sk-...':'Optional if your endpoint is public'}"><details ${advanced?'open':''}><summary>${esc(tr('provider.advanced'))}</summary>${advanced}</details><p class="hint">${name==='chat'?esc(tr('setup.apiKeyHint')):name==='stt'?'OpenAI: /audio/transcriptions. Hugging Face: ASR task endpoint.':'OpenAI: /audio/speech. Hugging Face: TTS task endpoint.'}</p></article>`}
    function renderServices(){const stt=`<label>${esc(tr('provider.language'))}</label><input id="stt-language" value="${esc(state.cfg.stt.language)}" placeholder="${state.lang}">`;const tts=`<div class="grid two"><div><label>${esc(tr('provider.voice'))}</label><input id="tts-voice" value="${esc(state.cfg.tts.voice)}" placeholder="alloy"></div><div><label>${esc(tr('provider.speed'))}</label><input id="tts-speed" type="number" min="0.25" max="4" step="0.05" value="${esc(state.cfg.tts.speed)}"></div></div>`;$('services').innerHTML=providerCard('chat',tr('provider.chatTitle'),'')+providerCard('stt',tr('provider.sttTitle'),stt)+providerCard('tts',tr('provider.ttsTitle'),tts)+`<datalist id="chatModels"></datalist>`;['chat','stt','tts'].forEach(n=>{const c=state.cfg[n];$(`${n}-protocol`).value=c.protocol});document.querySelectorAll('.copy-chat').forEach(b=>b.onclick=()=>{readServices();const n=b.dataset.service;state.cfg[n]={...state.cfg[n],baseUrl:state.cfg.chat.baseUrl,apiKey:state.cfg.chat.apiKey};if(state.cfg.chat.protocol!=='anthropic-compatible')state.cfg[n].protocol=state.cfg.chat.protocol;renderServices()});$('modelsBtn').onclick=loadModels}
    function readServices(){['chat','stt','tts'].forEach(n=>{state.cfg[n].protocol=$(`${n}-protocol`).value;state.cfg[n].baseUrl=$(`${n}-baseUrl`).value.trim();state.cfg[n].apiKey=$(`${n}-apiKey`).value.trim();state.cfg[n].model=$(`${n}-model`).value.trim()});state.cfg.stt.language=$('stt-language').value.trim()||state.lang;state.cfg.tts.voice=$('tts-voice').value.trim()||'alloy';state.cfg.tts.speed=$('tts-speed').value||'1'}
    function design(){return{goal:$('goal').value.trim(),methodology:$('methodology').value,targetAudience:$('targetAudience').value.trim(),scenarios:$('scenarios').value.trim(),persona:$('persona').value.trim()}}
    async function request(url,body={}){const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,lang:state.lang})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);return data}
    function error(id,msg){$(id).textContent=msg;$(id).classList.remove('hidden')}function clearError(id){$(id).textContent='';$(id).classList.add('hidden')}
    function overlay(title,text){$('overlayTitle').textContent=title;$('overlayText').textContent=text;$('overlay').classList.add('active');let p=8;$('overlayBar').style.width=p+'%';return setInterval(()=>{$('overlayBar').style.width=(p=Math.min(90,p+11))+'%'},700)}function closeOverlay(timer){clearInterval(timer);$('overlayBar').style.width='100%';setTimeout(()=>{$('overlay').classList.remove('active');$('overlayBar').style.width='0%'},250)}
    async function loadModels(){readServices();const c=state.cfg.chat;if(!c.apiKey)return error('setupError',tr('errors.apiKeyRequired'));try{const {models}=await request('/api/models',c);$('chatModels').innerHTML=models.map(m=>`<option value="${esc(m.id)}">`).join('')}catch(e){error('setupError',e.message)}}
    function stageName(stage){return tr(`stageLabels.${stage}`,stage)}
    function applyLanguage(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-copy]').forEach(el=>{const key=el.dataset.copy;el.textContent=tr(key)});document.querySelectorAll('.step i').forEach((el,i)=>el.textContent=tr(`phases.${i}`));$('goal').placeholder=tr('setup.goalPlaceholder');$('targetAudience').placeholder=tr('setup.targetAudiencePlaceholder');$('scenarios').placeholder=tr('setup.scenariosPlaceholder');$('persona').placeholder=tr('setup.personaPlaceholder');$('answer').placeholder=tr('chat.inputPlaceholder');$('endedNotice').textContent=tr('chat.endedNotice');$('muteBtn').textContent=state.mute?tr('chat.unmute'):tr('chat.mute');['General','Jobs-to-be-Done','5 Whys','STAR','Persona'].forEach((label,i)=>{$('methodology').options[i].text=state.lang==='zh'?['通用','Jobs-to-be-Done','五问法','STAR','画像'][i]:label});renderServices();if(state.framework)renderFramework();document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang))}
    function frameworkHTML(fw){const topics=fw.topics||[];$('frameworkStats').innerHTML=`<div class="metric"><b>${topics.length}</b><span>${tr('framework.topic')}</span></div><div class="metric"><b>${fw.estimatedTurns||'-'}</b><span>${tr('framework.estimatedTurns')}</span></div><div class="metric"><b>${(fw.endingCriteria||[]).length}</b><span>${tr('framework.endingCriteria')}</span></div>`;$('frameworkHost').innerHTML=topics.map((topic,i)=>`<div class="service framework-block" data-index="${i}"><div class="eyebrow">${tr('framework.topic')} ${i+1}</div><label>${tr('framework.name')}</label><input data-field="name" value="${esc(topic.name)}"><label>${tr('framework.goal')}</label><textarea data-field="goal">${esc(topic.goal)}</textarea><div class="grid three"><div><label>${tr('framework.stage')}</label><select data-field="stage">${['introduce','explore','probe','confirm'].map(s=>`<option value="${s}" ${s===topic.stage?'selected':''}>${stageName(s)}</option>`).join('')}</select></div><div><label>${tr('framework.minQuestions')}</label><input data-field="min_questions" type="number" min="1" value="${Number(topic.min_questions||1)}"></div><div><label>${tr('framework.maxQuestions')}</label><input data-field="max_questions" type="number" min="1" value="${Number(topic.max_questions||1)}"></div></div><label>${tr('framework.focusPrompt')}</label><textarea data-field="focus_prompt">${esc(topic.focus_prompt||'')}</textarea></div>`).join('')+`<div class="service"><div class="eyebrow">${tr('framework.endingCriteria')}</div>${(fw.endingCriteria||[]).map((x,i)=>`<input data-ending="${i}" value="${esc(x)}" style="margin-top:8px">`).join('')}</div>`;document.querySelectorAll('.framework-block').forEach(block=>block.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{const t=state.framework.topics[Number(block.dataset.index)];t[el.dataset.field]=el.type==='number'?Math.max(1,Number(el.value||1)):el.value}));document.querySelectorAll('[data-ending]').forEach(el=>el.oninput=()=>state.framework.endingCriteria[Number(el.dataset.ending)]=el.value)}
    function renderFramework(){frameworkHTML(state.framework)}
    async function generateFramework(){clearError('setupError');readServices();const d=design(),c=state.cfg.chat;if(!d.goal)return error('setupError',tr('errors.goalRequired'));if(!c.apiKey||!c.model)return error('setupError',!c.apiKey?tr('errors.apiKeyRequired'):tr('errors.modelRequired'));const timer=overlay(tr('status.generatingFramework'),tr('setup.frameworkHint'));$('generateBtn').disabled=true;try{state.framework=(await request('/api/interview/framework',{...c,...d})).framework;renderFramework();setPhase('framework')}catch(e){error('setupError',e.message)}finally{$('generateBtn').disabled=false;closeOverlay(timer)}}
    async function startInterview(mode){clearError('frameworkError');readServices();if(!state.framework?.topics?.length)return error('frameworkError',tr('errors.frameworkRequired'));state.mode=mode;document.body.classList.toggle('respondent',mode==='respondent');const c=state.cfg.chat,d=design(),timer=overlay(tr('status.startingInterview'),tr('status.generatingQuestion'));try{const data=await request('/api/interview/start',{...c,...d,framework:state.framework});state.sessionId=data.id;state.rows=[];$('messages').innerHTML='';setPhase('chat');appendMessage('assistant',data.message,data);if(data.interviewEnded)finishChat()}catch(e){error('frameworkError',e.message)}finally{closeOverlay(timer)}}
    function appendMessage(role,text,meta={}){const el=document.createElement('div');el.className=`msg ${role}`;el.innerHTML=esc(text);if(role==='assistant'&&(meta.topic_name||meta.stage||meta.action||meta.reason)){const m=document.createElement('div');m.className='meta';m.textContent=[meta.topic_name,meta.stage?stageName(meta.stage):'',meta.action].filter(Boolean).join(' · ')+(meta.reason?`\n${meta.reason}`:'');el.appendChild(m)}$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight;state.rows.push({role,text,meta});if(role==='assistant')attachTTS(el,text)}
    async function attachTTS(host,text){readServices();const c=state.cfg.tts;if(state.mute||!c.baseUrl||!c.model||!c.apiKey)return;const row=document.createElement('div');row.className='message-audio';row.textContent=tr('chat.playing');host.appendChild(row);try{const res=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,...c})});if(!res.ok)throw new Error((await res.json().catch(()=>({}))).error||'TTS failed');const url=URL.createObjectURL(await res.blob());const audio=document.createElement('audio');audio.controls=true;audio.src=url;audio.onended=()=>URL.revokeObjectURL(url);row.replaceChildren(audio)}catch{const retry=document.createElement('button');retry.className='btn secondary';retry.textContent=tr('chat.retry');retry.onclick=()=>{row.remove();attachTTS(host,text)};row.replaceChildren(retry)}}
    function finishChat(){if(state.mode==='respondent'){setPhase('thanks');return}$('endedNotice').classList.remove('hidden');$('nextBtn').classList.add('hidden')}
    async function send(){const text=$('answer').value.trim();if(!text||!state.sessionId)return;clearError('chatError');$('answer').value='';appendMessage('user',text);$('sendBtn').disabled=true;try{const data=await request(`/api/interview/${state.sessionId}/message`,{text,apiKey:state.cfg.chat.apiKey});appendMessage('assistant',data.message,data);if(data.interviewEnded)finishChat()}catch(e){error('chatError',e.message)}finally{$('sendBtn').disabled=false;$('answer').focus()}}
    async function transcribe(final=false){readServices();const c=state.cfg.stt;if(!state.chunks.length||state.busySTT||!c.baseUrl||!c.model||!c.apiKey)return;state.busySTT=true;try{const blob=new Blob(state.chunks,{type:state.recorder?.mimeType||'audio/webm'});const form=new FormData();form.append('audio',blob,'answer.webm');Object.entries(c).forEach(([k,v])=>form.append(k,v));const res=await fetch('/api/transcribe',{method:'POST',body:form});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'STT failed');$('partial').textContent=`${tr('chat.partialTranscript')}: ${data.text||''}`;if(final&&data.text){$('answer').value=data.text;$('partial').textContent=tr('chat.editTranscript')}}catch(e){$('partial').textContent=tr('chat.sttError')}finally{state.busySTT=false}}
    async function toggleRecord(){if(state.recorder?.state==='recording'){state.recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});state.chunks=[];const type=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';state.recorder=new MediaRecorder(stream,{mimeType:type});state.recorder.ondataavailable=e=>{if(e.data.size)state.chunks.push(e.data)};state.recorder.onstop=async()=>{clearInterval(state.timer);$('recordBtn').classList.remove('recording');$('recordBtn').textContent='●';stream.getTracks().forEach(t=>t.stop());await transcribe(true)};state.recorder.start(350);state.timer=setInterval(()=>transcribe(false),1500);$('recordBtn').classList.add('recording');$('recordBtn').textContent='■';$('partial').textContent=tr('chat.listening')}catch{error('chatError',tr('chat.micDenied'))}}
    function renderReport(data){const r=data.report||{};$('reportHost').innerHTML=`<div class="grid three"><div class="metric"><b>${(r.themes||[]).length}</b><span>${tr('report.themes')}</span></div><div class="metric"><b>${(r.insights||[]).length}</b><span>${tr('report.insights')}</span></div><div class="metric"><b>${(r.recommendations||[]).length}</b><span>${tr('report.recommendations')}</span></div></div><div class="service"><div class="eyebrow">${tr('report.summary')}</div><p>${esc(r.summary||'')}</p></div>${r.sentiment?`<div class="service"><div class="eyebrow">${tr('report.sentiment')}</div><p>${esc(r.sentiment)}</p></div>`:''}${(r.themes||[]).length?`<h3>${tr('report.themes')}</h3><div class="grid three">${r.themes.map(x=>`<div class="service"><b>${esc(x.name)}</b><p class="muted">${esc(x.description)}</p>${x.quotes?.[0]?`<div class="quote">${esc(x.quotes[0])}</div>`:''}</div>`).join('')}</div>`:''}${(r.insights||[]).length?`<h3>${tr('report.insights')}</h3><div class="list">${r.insights.map(x=>`<div class="service"><b>${esc(x.finding)}</b><p class="muted">${esc(x.evidence)}</p></div>`).join('')}</div>`:''}${(r.recommendations||[]).length?`<h3>${tr('report.recommendations')}</h3><div class="grid two">${r.recommendations.map(x=>`<div class="service">${esc(x)}</div>`).join('')}</div>`:''}`;renderTranscript()}
    function renderTranscript(){$('transcriptHost').innerHTML=`<table><thead><tr><th>Role</th><th>Text</th><th>Topic</th><th>Stage</th></tr></thead><tbody>${state.rows.map(r=>`<tr><td>${r.role==='assistant'?(state.lang==='zh'?'主持人':'Moderator'):(state.lang==='zh'?'受访者':'Respondent')}</td><td>${esc(r.text)}</td><td>${esc(r.meta?.topic_name||'')}</td><td>${esc(r.meta?.stage||'')}</td></tr>`).join('')}</tbody></table>`}
    async function report(){const timer=overlay(tr('status.generatingReport'),tr('report.title'));try{renderReport(await request(`/api/interview/${state.sessionId}/report`,{apiKey:state.cfg.chat.apiKey}));setPhase('report')}catch(e){error('chatError',e.message)}finally{closeOverlay(timer)}}
    async function evaluate(){try{const e=(await request(`/api/interview/${state.sessionId}/evaluate`,{apiKey:state.cfg.chat.apiKey})).evaluation;const dims={naturalness:'Naturalness',relevance:'Relevance',probing:'Probing',single_question:'Single question',no_bias:'No bias',progression:'Progression',ending:'Ending',persona_fit:'Persona fit'};$('evalHost').innerHTML=`<div class="service"><div class="eyebrow">${tr('report.evaluate')}</div><p>${esc(e.overall_comment||'')}</p><div class="bar-list">${Object.entries(dims).map(([k,v])=>{const n=Number(e.scores?.[k]||0);return`<div class="barrow"><span>${v}</span><div class="track"><span style="width:${n/5*100}%"></span></div><b>${n}/5</b></div>`}).join('')}</div></div>`}catch(e){$('evalHost').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
    function csv(){const pairs=[];for(let i=0;i<state.rows.length;i++){if(state.rows[i].role==='assistant'){const a=state.rows[i+1]?.role==='user'?state.rows[i+1].text:'';pairs.push([pairs.length+1,state.rows[i].text,a]);if(a)i++}}const text=[['No.','Question','Answer'],...pairs].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download='interview-qa.csv';a.click();URL.revokeObjectURL(a.href)}
    document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;applyLanguage()});$('generateBtn').onclick=generateFramework;$('backBtn').onclick=()=>setPhase('setup');$('startBtn').onclick=()=>setPhase('role');$('respondentBtn').onclick=()=>startInterview('respondent');$('interviewerBtn').onclick=()=>startInterview('interviewer');$('sendBtn').onclick=send;$('answer').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('recordBtn').onclick=toggleRecord;$('nextBtn').onclick=()=>{$('answer').value=state.lang==='zh'?'继续':'Continue';send()};$('endBtn').onclick=report;$('muteBtn').onclick=()=>{state.mute=!state.mute;applyLanguage();if(state.mute)document.querySelectorAll('audio').forEach(a=>a.pause())};$('csvBtn').onclick=csv;$('evalBtn').onclick=evaluate;$('newBtn').onclick=()=>location.reload();applyLanguage();
  </script>
</body>
</html>
